name: Build APK

# Se ejecuta al hacer push a main/master, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas y build-tools necesarios
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: RideAdvisor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
